name: Verify zero-cost company research agent
on:
  push:
    paths:
      - "main.py"
      - "tests/**"
      - ".actor/**"
      - "Dockerfile"
      - ".github/workflows/agent-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: |
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -v
      - name: Validate Apify configuration
        run: |
          python -m json.tool .actor/actor.json > /dev/null
          python -m json.tool .actor/input_schema.json > /dev/null
