name: Agent validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q main.py sales.py discovery.py
      - run: python -m unittest discover -v
      - name: Validate daily discovery configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('daily_input.json').read_text())
          assert not p['urls']
          assert p['discovery_country'] == 'LT'
          assert len(p['keywords']) == 10
          assert p['sales_pipeline'] is True
          assert p['sync_hubspot'] is False
          PY
