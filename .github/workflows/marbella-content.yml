name: Marbella content planning – draft only
on:
  push:
    paths:
      - "marbella/**"
      - ".github/workflows/marbella-content.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and draft content
        run: |
          python -m unittest discover -s marbella -p 'test_*.py' -v
          python marbella/content_agent.py --output marbella/weekly_content.json
      - name: Upload drafts, no social publishing
        uses: actions/upload-artifact@v4
        with:
          name: marbella-seven-day-drafts
          path: marbella/weekly_content.json
          retention-days: 7
